name: bmi_calculator
description: محاسبه شاخص BMI

publish_to: 'none' 
version: 1.2.0+3

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  bloc: any
  flutter_bloc: any
  firebase_core: any
  firebase_analytics: ^10.4.3
  flutter_lints: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/boys-data.json
    - assets/girls-data.json

  fonts:
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSans.ttf

