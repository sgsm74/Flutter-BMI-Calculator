name: bmi_calculator
description: محاسبه شاخص BMI

publish_to: 'none' 
version: 1.1.0+2

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  bloc: ^7.0.0
  flutter_bloc: ^7.0.1
  firebase_core: any
  firebase_analytics: ^10.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/boys-data.json
    - assets/girls-data.json

  fonts:
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSans.ttf

